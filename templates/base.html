<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Zen IT Helpdesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">Zen IT</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        {% if user.is_authenticated %}
          {% if user.is_technician %}<li class="nav-item"><a class="nav-link" href="{% url 'tech_dashboard' %}">Tech Board</a></li>{% else %}<li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Mes Tickets</a></li>{% endif %}
          <li class="nav-item"><a class="nav-link" href="/logout/">Déconnexion</a></li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="/login/">Connexion</a></li>
          <li class="nav-item"><a class="nav-link" href="/register/">Inscription</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
